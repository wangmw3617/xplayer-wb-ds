name: Android CI

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile & lint
        run: ./gradlew compileDebugKotlin lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found" >&2
            exit 1
          fi
          TARGET=app/build/outputs/apk/debug/XPlayer-arm64-v8a-debug.apk
          cp "$APK" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          ls -lh "$TARGET"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XPlayer-arm64-v8a-debug
          path: app/build/outputs/apk/debug/XPlayer-arm64-v8a-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Assemble signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          XPLAYER_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          XPLAYER_KEYSTORE_PASSWORD: ${{ secrets.XPLAYER_KEYSTORE_PASSWORD }}
          XPLAYER_KEY_ALIAS: ${{ secrets.XPLAYER_KEY_ALIAS }}
          XPLAYER_KEY_PASSWORD: ${{ secrets.XPLAYER_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$XPLAYER_KEYSTORE_PASSWORD" ]; then
            echo "${{ secrets.XPLAYER_KEYSTORE_BASE64 }}" | base64 -d > "$XPLAYER_KEYSTORE_PATH"
          else
            echo "No keystore secret configured, release build will fall back to debug signing."
          fi
          ./gradlew assembleRelease --stacktrace
          find app/build/outputs/apk/release -name '*.apk' -exec ls -lh {} \;

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XPlayer ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/XPlayer-arm64-v8a-debug.apk
          generate_release_notes: true
