name: Android CI

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时构建 release APK（不推 tag 也能拿到发布包）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build multi-ABI APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile & lint
        run: ./gradlew compileDebugKotlin lintDebug --stacktrace

      # ---------- debug 包：四个架构 + universal ----------

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Package debug APKs
        run: |
          set -e
          mkdir -p dist/debug
          shopt -s nullglob
          count=0
          for apk in app/build/outputs/apk/debug/*.apk; do
            base=$(basename "$apk" .apk)      # app-arm64-v8a-debug
            variant=${base#app-}              # arm64-v8a-debug
            abi=${variant%-debug}             # arm64-v8a / universal
            cp "$apk" "dist/debug/XPlayer-${abi}-debug.apk"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "debug APK not found" >&2
            exit 1
          fi
          ls -lh dist/debug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: XPlayer-debug-apks
          path: dist/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # ---------- 发布包：推 v* 标签，或手动触发时勾选 build_release ----------

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        env:
          KEYSTORE_B64: ${{ secrets.XPLAYER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XPLAYER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XPLAYER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XPLAYER_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "XPLAYER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "XPLAYER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "XPLAYER_KEY_ALIAS=$KEY_ALIAS"
              echo "XPLAYER_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "使用仓库 Secrets 中的正式 keystore 签名。"
          else
            echo "::warning::未配置 keystore secrets，release APK 回退 debug 证书签名（可安装，但不可上架）。"
          fi

      - name: Assemble release APKs
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        run: ./gradlew assembleRelease --stacktrace

      - name: Package release APKs
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        run: |
          set -e
          mkdir -p dist/release
          shopt -s nullglob
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          count=0
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk" .apk)      # app-arm64-v8a-release
            variant=${base#app-}              # arm64-v8a-release
            abi=${variant%-release}           # arm64-v8a / universal
            target="dist/release/XPlayer-${abi}-release.apk"
            cp "$apk" "$target"
            count=$((count + 1))
            echo "----- XPlayer-${abi}-release.apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$target" | grep -m1 "certificate DN" || true
            "$BUILD_TOOLS/aapt2" dump badging "$target" \
              | grep -E "^package: name|^native-code" \
              | sed -E 's/platformBuildVersion.*//'
          done
          if [ "$count" -eq 0 ]; then
            echo "release APK not found" >&2
            exit 1
          fi
          ls -lh dist/release

      - name: Upload release APKs
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        uses: actions/upload-artifact@v7
        with:
          name: XPlayer-release-apks
          path: dist/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: XPlayer ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/release/*.apk
            dist/debug/*.apk
          generate_release_notes: true
          body: |
            ## 按架构选择安装包

            | 设备 | 下载文件 |
            | --- | --- |
            | 绝大多数手机 / 平板（2017 年后，arm64） | `XPlayer-arm64-v8a-release.apk` |
            | 老设备 / 32 位 ROM（armeabi-v7a） | `XPlayer-armeabi-v7a-release.apk` |
            | 模拟器（x86 / x86_64） | `XPlayer-x86-release.apk`、`XPlayer-x86_64-release.apk` |
            | 不确定，想一个包通吃 | `XPlayer-universal-release.apk` |

            安装：`adb install -r <文件名>`；不确定机型架构可执行 `adb shell getprop ro.product.cpu.abi` 查看。

            `*-debug.apk` 为调试包，用于排查问题，日常使用请装 release 包。
