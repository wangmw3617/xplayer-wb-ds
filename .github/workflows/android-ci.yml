name: Android CI

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
    inputs:
      build_release:
        description: '同时构建 release APK（不推 tag 也能拿到发布包）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compile & lint
        run: ./gradlew compileDebugKotlin lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate debug APK
        id: apk
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found" >&2
            exit 1
          fi
          TARGET=app/build/outputs/apk/debug/XPlayer-arm64-v8a-debug.apk
          cp "$APK" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          ls -lh "$TARGET"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: XPlayer-arm64-v8a-debug
          path: app/build/outputs/apk/debug/XPlayer-arm64-v8a-debug.apk
          retention-days: 14
          if-no-files-found: error

      # ---------- 发布包：推 v* 标签，或手动触发时勾选 build_release ----------

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        env:
          KEYSTORE_B64: ${{ secrets.XPLAYER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.XPLAYER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XPLAYER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XPLAYER_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "XPLAYER_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "XPLAYER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "XPLAYER_KEY_ALIAS=$KEY_ALIAS"
              echo "XPLAYER_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "使用仓库 Secrets 中的正式 keystore 签名。"
          else
            echo "::warning::未配置 keystore secrets，release APK 回退 debug 证书签名（可安装，但不可上架）。"
          fi

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        run: |
          set -e
          ./gradlew assembleRelease --stacktrace
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          TARGET=app/build/outputs/apk/release/XPlayer-arm64-v8a-release.apk
          cp "$APK" "$TARGET"
          ls -lh "$TARGET"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$TARGET" | head -n 6 || true

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v') || inputs.build_release
        uses: actions/upload-artifact@v7
        with:
          name: XPlayer-arm64-v8a-release
          path: app/build/outputs/apk/release/XPlayer-arm64-v8a-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: XPlayer ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/XPlayer-arm64-v8a-release.apk
            app/build/outputs/apk/debug/XPlayer-arm64-v8a-debug.apk
          generate_release_notes: true
